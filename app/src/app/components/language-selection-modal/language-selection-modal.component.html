<div class="dialog-wrapper">
  <h2 class="dialog-header">
    <ng-icon name="saxGlobalOutline" size="24px" class="gold-icon"></ng-icon>
    <span>{{ 'languageSelection.title' | translate }}</span>
  </h2>
  
  <div class="dialog-content">
    <p class="dialog-subtitle">{{ 'languageSelection.description' | translate }}</p>
    
    <div class="languages-list">
      @for (language of supportedLanguages; track language.code) {
        <button 
          class="language-item" 
          [class.active]="language.code === languageService.getCurrentLanguage()"
          (click)="selectLanguage(language)"
        >
          <div class="lang-details">
            <span class="flag-icon">{{ language.flag }}</span>
            <span class="language-name">{{ language.name }}</span>
          </div>
          @if (language.code === languageService.getCurrentLanguage()) {
            <span class="active-checkmark">✓</span>
          }
        </button>
      }
    </div>
  </div>
  
  <div class="dialog-actions">
    <button mat-button class="cancel-btn" (click)="close()">
      {{ 'app.close' | translate }}
    </button>
  </div>
</div>
