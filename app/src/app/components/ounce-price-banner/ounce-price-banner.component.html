@let price = priceService.value();
@if (priceService.isMarketOpen()) {
  <a
    class="price-pill"
    href="https://www.tradingview.com/symbols/XAUUSD"
    target="_blank"
  >
    <img
      src="https://s3-symbol-logo.tradingview.com/metal/gold--big.svg"
      alt="gold"
    />
    <span class="price-text" [style.color]="color()">
      {{ (price > 0 ? price : 2345.67) | currency:'USD':'symbol':'1.2-2' }}
    </span>
  </a>
}
