@if (auth.userQuery.data()) {
  <div class="octo-banner-modern glass-panel" (click)="goToOctopus($event)">
    <!-- Decorative background elements -->
    <div class="glow-bg"></div>

    <!-- Left Content (Text and Action) -->
    <div class="banner-content">
      <div class="header-group">
        <span class="game-tag">DAILY GAME</span>
        <h2 class="banner-title">{{ 'octopus.title' | translate }}</h2>
      </div>
      <p class="banner-subtitle">{{ 'octopus.subtitle' | translate }}</p>
      
      <div class="play-badge">
        <span>PLAY NOW</span>
        <span class="arrow">→</span>
      </div>
    </div>

    <!-- Right Content (Visual Concept: Star + Trend Indicators) -->
    <div class="banner-visual">
      <div class="visual-card">
        <div class="star-wrapper">
          <span class="star-emoji">⭐</span>
        </div>
        <div class="trend-lines">
          <div class="trend-up"><ng-icon name="saxTrendUpBold"></ng-icon></div>
          <div class="trend-down"><ng-icon name="saxTrendDownBold"></ng-icon></div>
        </div>
      </div>
    </div>
  </div>
}
