<div class="empty-state">
  @if (iconName()) {
    <ng-icon [name]="iconName()" size="48px" class="empty-state__icon"></ng-icon>
  }
  @if (icon()) {
    <ng-icon [name]="icon()" size="48px" class="empty-state__icon"></ng-icon>
  }
  @if (text()) {
    <p class="empty-state__text">{{ text() }}</p>
  }
</div>
