<mat-toolbar dir="ltr">
  <a mat-button routerLink="/signals" routerLinkActive #rlaSignals="routerLinkActive">
    <div class="nav-item-wrapper">
      <ng-icon [name]="rlaSignals.isActive ? 'saxActivityBold' : 'saxActivityOutline'" size="24px"></ng-icon>
      {{ 'bottomNav.signals' | translate }}
    </div>
  </a>
  <a mat-button routerLink="/market" routerLinkActive #rlaMarket="routerLinkActive">
    <div class="nav-item-wrapper">
      <ng-icon [name]="rlaMarket.isActive ? 'saxCandle2Bold' : 'saxCandle2Outline'" size="24px"></ng-icon>
      {{ 'bottomNav.market' | translate }}
    </div>
  </a>
  <a mat-button routerLink="/leaderboard" routerLinkActive #rlaLeaderboard="routerLinkActive">
    <div class="nav-item-wrapper">
      <ng-icon [name]="rlaLeaderboard.isActive ? 'saxCupBold' : 'saxCupOutline'" size="24px"></ng-icon>
      {{ 'bottomNav.leaderboard' | translate }}
    </div>
  </a>
  <a mat-button [routerLink]="authService.userQuery.data() ? '/menu' : '/login'" routerLinkActive #rlaMenu="routerLinkActive">
    <div class="nav-item-wrapper">
      <ng-icon [name]="rlaMenu.isActive ? 'saxMenu1Bold' : 'saxMenu1Outline'" size="24px"></ng-icon>
      {{ 'bottomNav.menu' | translate }}
    </div>
  </a>
</mat-toolbar>
