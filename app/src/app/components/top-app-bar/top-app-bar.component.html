@let user = auth.userQuery.data();
<mat-toolbar fxLayout="row" fxLayoutAlign="space-between center">
  @if (user) {
    <button mat-button class="user-button" routerLink="/profile">
      <div class="user-button__container">
        <img [src]="user.avatar" [appAvatar]="user" [size]="24" class="user-button__avatar" />
        <div class="user-button__texts">
          {{ user | fullname }}
          <span ltr class="user-button__gem">
            <ng-icon name="saxDiamondsBold" class="blue"></ng-icon>
            {{ user.gem || 0 | number }}
          </span>
        </div>
      </div>
    </button>
  } @else {
    <button mat-button routerLink="/login">
      <ng-icon name="saxUserOutline" size="20px"></ng-icon>
      {{ 'login.phoneTitle' | translate }}
    </button>
  }
  <span spacer></span>
  <button
    mat-icon-button
    class="notification-button"
    (click)="toggleNotifications()"
    [title]="(pushService.isSubscribed() ? 'pushNotifications.bell.disable' : 'pushNotifications.bell.enable') | translate"
  >
    <ng-icon
      [name]="pushService.isSubscribed() ? 'saxNotificationBold' : 'saxNotificationOutline'"
      size="20px"
      [class.gold]="pushService.isSubscribed()"
    ></ng-icon>
  </button>
  <!-- <a mat-stroked-button class="ounce-price-button" href="https://www.tradingview.com/symbols/XAUUSD" target="_blank">
    <img
    src="https://s3-symbol-logo.tradingview.com/metal/gold--big.svg"
    alt="logo"
    />
    {{ priceService.value() | currency }}
  </a> -->
</mat-toolbar>
