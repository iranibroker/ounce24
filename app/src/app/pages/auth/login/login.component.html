<mat-toolbar>
  <button mat-icon-button goBack>
    <ng-icon name="saxArrowLeftOutline" class="rtl"></ng-icon>
  </button>
</mat-toolbar>

<div class="login-page">
  <!-- Brand Logo -->
  <div class="login-logo-container">
    <img src="images/logo.svg" alt="Ounce24 Logo" class="login-logo" />
  </div>

  <!-- Sign In Methods -->
  <div class="auth-methods">
    <h3>{{ 'login.chooseDescription' | translate }}</h3>
    
    <div class="buttons-layout">
      <!-- Telegram Button -->
      <button mat-flat-button class="telegram-oidc-btn" (click)="onTelegramOidcClick()">
        <ng-icon name="simpleTelegram" size="20px" class="telegram-icon"></ng-icon>
        <span>{{ 'login.loginWithTelegram' | translate }}</span>
      </button>

      @if (showGoogleLogin) {
        <!-- OR Divider -->
        <div class="or-divider">
          <span>{{ 'login.or' | translate }}</span>
        </div>

        <!-- Google Sign-In Button Container -->
        <div class="google-btn-wrapper">
          <div #googleBtn></div>
        </div>
      }
    </div>
  </div>

  @if (errorMessage()) {
    <p class="error-message">{{ errorMessage() | translate }}</p>
  }
</div>

@if (loading()) {
  <div class="loading-overlay">
    <mat-spinner diameter="40"></mat-spinner>
    <p class="loading-text">{{ 'login.telegram.logging_in' | translate }}</p>
  </div>
}
